version: '3'
services:
  connector-csis:
    image: opencti/connector-csis:latest
    environment:
      - OPENCTI_URL=http://localhost
      - OPENCTI_TOKEN=ChangeMe
      - CONNECTOR_ID=ChangeMe
      # - CONNECTOR_NAME=CSIS Cyber Data Feed
      # - CONNECTOR_SCOPE=IPv4-Addr,IPv6-Addr,Domain-Name,Indicator,Malware,Intrusion-Set
      # - CONNECTOR_LOG_LEVEL=error
      # - CONNECTOR_DURATION_PERIOD=PT6H
      - CSIS_CLIENT_ID=ChangeMe
      - CSIS_CLIENT_SECRET=ChangeMe
      # - CSIS_FEED_TYPES=advanced # 'essential', 'advanced' or 'essential,advanced'
      # - CSIS_TLP_LEVEL=amber # 'clear', 'white', 'green', 'amber', 'amber+strict', 'red'
      # - CSIS_MIN_CONFIDENCE_SCORE=0
      # - CSIS_REQUEST_TIMEOUT_SECONDS=60
    restart: always
